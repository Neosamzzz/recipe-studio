function getAnimatedIcon(item){const signature=JSON.stringify(item.iconAnimation);let cache=animatedIconCache.get(item.id);if(cache&&cache.src===item.icon&&cache.signature===signature)return cache;cache={src:item.icon,signature,ready:false,start:0,frames:new Map()};animatedIconCache.set(item.id,cache);loadIconImage(item.icon).then(image=>{cache.image=image;cache.animation=McItemAnimation.parse(item.iconAnimation,image.naturalWidth,image.naturalHeight);cache.canvas=document.createElement('canvas');cache.canvas.width=cache.animation.width;cache.canvas.height=cache.animation.height;cache.context=cache.canvas.getContext('2d',{willReadFrequently:true});cache.context.imageSmoothingEnabled=false;cache.start=performance.now();cache.ready=true}).catch(error=>{cache.failed=true;stat('动态图标“'+item.name+'”：'+error.message)});return cache}
function drawAnimatedIcon(cache,now){const a=cache.animation,state=McItemAnimation.frameAt(a,now-cache.start),context=cache.context;function draw(index){context.clearRect(0,0,a.width,a.height);context.drawImage(cache.image,index%a.columns*a.width,Math.floor(index/a.columns)*a.height,a.width,a.height,0,0,a.width,a.height)}if(!a.interpolate||state.index===state.next||state.blend===0){draw(state.index);return}function pixels(index){if(!cache.frames.has(index)){draw(index);cache.frames.set(index,context.getImageData(0,0,a.width,a.height))}return cache.frames.get(index)}const from=pixels(state.index),to=pixels(state.next);if(!cache.blended)cache.blended=context.createImageData(a.width,a.height);const result=cache.blended.data;for(let n=0;n<result.length;n++)result[n]=Math.round(from.data[n]*(1-state.blend)+to.data[n]*state.blend);context.putImageData(cache.blended,0,0)}
let lastIconFrame=0;
function animateItemIcons(now){requestAnimationFrame(animateItemIcons);if(document.hidden||now-lastIconFrame<32)return;lastIconFrame=now;const drawn=new Set();for(const canvas of document.querySelectorAll('canvas[data-animated-item]')){const item=itemBy(canvas.dataset.animatedItem);if(!item?.icon||!item.iconAnimation)continue;const cache=getAnimatedIcon(item);if(!cache.ready)continue;if(!drawn.has(item.id)){drawAnimatedIcon(cache,now);drawn.add(item.id)}if(canvas.width!==cache.canvas.width||canvas.height!==cache.canvas.height){canvas.width=cache.canvas.width;canvas.height=cache.canvas.height}const context=canvas.getContext('2d');context.imageSmoothingEnabled=false;context.clearRect(0,0,canvas.width,canvas.height);context.drawImage(cache.canvas,0,0)}for(const id of animatedIconCache.keys())if(!itemBy(id)?.iconAnimation)animatedIconCache.delete(id)}
requestAnimationFrame(animateItemIcons);
